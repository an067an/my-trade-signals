<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>⚡ Pocket Option Auto-Scanner</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --accent: #38bdf8;
      --green: #22c55e;
      --red: #ef4444;
      --yellow: #eab308;
      --text: #f8fafc;
      --subtext: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    body { background-color: var(--bg-color); color: var(--text); display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 16px; }
    .header { width: 100%; text-align: center; margin-bottom: 16px; font-weight: 700; font-size: 18px; color: var(--accent); }
    .card { background: var(--card-bg); width: 100%; max-width: 400px; border-radius: 16px; padding: 16px; margin-bottom: 12px; border: 1px solid #334155; }
    label { font-size: 11px; color: var(--subtext); text-transform: uppercase; letter-spacing: 0.5px; display: block; margin-bottom: 6px; }
    select, button { width: 100%; padding: 12px; border-radius: 10px; border: none; background: #0f172a; color: var(--text); font-size: 14px; outline: none; border: 1px solid #334155; }
    select { margin-bottom: 10px; }
    .btn-scan { background: linear-gradient(135deg, #10b981, #22c55e); color: #fff; font-weight: 700; font-size: 15px; cursor: pointer; transition: transform 0.1s, opacity 0.2s; border: none; margin-top: 4px; box-shadow: 0 4px 14px rgba(34, 197, 94, 0.3); }
    .btn-scan:active { transform: scale(0.98); }
    .btn-scan:disabled { opacity: 0.4; cursor: not-allowed; background: #334155; color: #94a3b8; box-shadow: none; }
    .btn-secondary { background: #1e293b; color: var(--subtext); font-weight: 500; font-size: 12px; border: 1px solid #334155; margin-top: 8px; cursor: pointer; }
    
    .result-box { display: none; text-align: center; padding: 16px 8px; }
    .pair-badge { font-size: 20px; font-weight: 800; color: var(--accent); margin-bottom: 4px; display: inline-block; background: #0f172a; padding: 6px 14px; border-radius: 8px; border: 1px solid #334155; }
    .signal-type { font-size: 28px; font-weight: 900; margin: 10px 0; }
    .signal-call { color: var(--green); }
    .signal-put { color: var(--red); }
    .accuracy { font-size: 13px; color: var(--subtext); margin-top: 4px; }
    .time-badge { font-size: 12px; color: var(--yellow); font-weight: bold; margin-top: 6px; }
    
    .loader { display: none; text-align: center; margin: 20px 0; }
    .spinner { border: 3px solid rgba(255,255,255,0.1); border-top: 3px solid var(--accent); border-radius: 50%; width: 32px; height: 32px; animation: spin 0.8s linear infinite; margin: 0 auto 10px; }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    
    .scan-status { font-size: 12px; color: var(--subtext); }
  </style>
</head>
<body>

  <div class="header">⚡ Pocket Option Smart Scanner</div>

  <div class="card">
    <label>Режим поиска сигнала</label>
    <select id="tfSelect">
      <option value="10s">Скальпинг (Экспирация 10 сек)</option>
      <option value="1m" selected>Стандарт (Экспирация 1 мин)</option>
      <option value="5m">Тренд (Экспирация 5 мин)</option>
    </select>

    <button id="scanBtn" class="btn-scan" onclick="scanAllPairs()">🎯 НАЙТИ ЛУЧШИЙ ВХОД (92%)</button>
  </div>

  <div class="card">
    <div id="loader" class="loader">
      <div class="spinner"></div>
      <div id="scanStatus" class="scan-status">Сканирование OTC рынка...</div>
    </div>

    <div id="resultBox" class="result-box">
      <div style="font-size: 11px; color: var(--subtext); margin-bottom: 6px;">НАЙДЕНА ОПТИМАЛЬНАЯ СДЕЛКА</div>
      <div id="bestPair" class="pair-badge">EUR / USD (OTC)</div>
      
      <div id="signalText" class="signal-type">CALL ⬆</div>
      
      <div id="timeBadge" class="time-badge">Время входа: 1 Минута</div>
      <div id="accuracyText" class="accuracy">Сила совпадения (Confluence): 94%</div>
    </div>
  </div>

  <script>
    if (window.Telegram && window.Telegram.WebApp) {
      window.Telegram.WebApp.ready();
      window.Telegram.WebApp.expand();
    }

    // Список всех доступных OTC пар с 92% выплатой
    const pairsPool = [
      { id: 'EURUSD_OTC', name: 'EUR / USD (OTC) [92%]', base: 1.0850, dec: 5 },
      { id: 'GBPUSD_OTC', name: 'GBP / USD (OTC) [92%]', base: 1.2650, dec: 5 },
      { id: 'USDJPY_OTC', name: 'USD / JPY (OTC) [92%]', base: 155.20, dec: 3 },
      { id: 'AUDUSD_OTC', name: 'AUD / USD (OTC) [92%]', base: 0.6650, dec: 5 },
      { id: 'USDCAD_OTC', name: 'USD / CAD (OTC) [92%]', base: 1.3680, dec: 5 },
      { id: 'USDCHF_OTC', name: 'USD / CHF (OTC) [92%]', base: 0.8950, dec: 5 },
      { id: 'GOLD_OTC',   name: 'GOLD (OTC) [92%]',      base: 2380.50, dec: 2 },
      { id: 'SILVER_OTC', name: 'SILVER (OTC) [92%]',    base: 28.40,  dec: 2 },
      { id: 'BRENT_OTC',  name: 'UKBRENT (OTC) [92%]',   base: 82.30,  dec: 2 },
      { id: 'AAPL_OTC',   name: 'AAPL Apple (OTC) [92%]', base: 224.30, dec: 2 },
      { id: 'TSLA_OTC',   name: 'TSLA Tesla (OTC) [92%]', base: 251.50, dec: 2 },
      { id: 'BTCUSD_OTC', name: 'BTC / USD (OTC) [92%]', base: 64200.0, dec: 2 }
    ];

    function generateSimulatedHistory(basePrice) {
      let history = [];
      let price = basePrice;
      for (let i = 0; i < 25; i++) {
        price += (Math.random() - 0.495) * (price * 0.00012);
        history.push(price);
      }
      return history;
    }

    function calculateRSI(prices, period = 10) {
      let gains = 0, losses = 0;
      for (let i = prices.length - period; i < prices.length; i++) {
        const diff = prices[i] - prices[i - 1];
        if (diff >= 0) gains += diff; else losses -= diff;
      }
      if (losses === 0) return 100;
      return 100 - (100 / (1 + (gains / losses)));
    }

    function calculateEMA(prices, period = 8) {
      const k = 2 / (period + 1);
      let ema = prices[prices.length - period];
      for (let i = prices.length - period + 1; i < prices.length; i++) {
        ema = (prices[i] * k) + (ema * (1 - k));
      }
      return ema;
    }

    function scanAllPairs() {
      const btn = document.getElementById('scanBtn');
      const loader = document.getElementById('loader');
      const resultBox = document.getElementById('resultBox');
      const scanStatus = document.getElementById('scanStatus');
      const tf = document.getElementById('tfSelect').value;

      btn.disabled = true;
      resultBox.style.display = 'none';
      loader.style.display = 'block';

      let currentStep = 0;
      const statusTextMap = [
        "Анализ микроструктуры тиков...",
        "Проверка RSI и перекупленности...",
        "Фильтрация трендов по EMA...",
        "Расчёт лучшей точки входа..."
      ];

      const statusInterval = setInterval(() => {
        if (currentStep < statusTextMap.length) {
          scanStatus.innerText = statusTextMap[currentStep];
          currentStep++;
        }
      }, 250);

      setTimeout(() => {
        clearInterval(statusInterval);
        
        // Оцениваем каждую пару из пула
        let ratedPairs = pairsPool.map(pair => {
          const history = generateSimulatedHistory(pair.base);
          const rsi = calculateRSI(history, 10);
          const ema = calculateEMA(history, 8);
          const lastPrice = history[history.length - 1];

          let isCall = rsi < 50;
          let score = 75 + Math.floor(Math.random() * 10);

          // Ищем идеальные краевые условия (овербоут/оверсолд)
          if (rsi <= 32) { isCall = true; score += 12; }
          else if (rsi >= 68) { isCall = false; score += 12; }
          else if (rsi < 42 && lastPrice > ema) { isCall = true; score += 7; }
          else if (rsi > 58 && lastPrice < ema) { isCall = false; score += 7; }

          return { pair, isCall, score, rsi };
        });

        // Сортируем пары по максимальной уверенности
        ratedPairs.sort((a, b) => b.score - a.score);
        const winner = ratedPairs[0]; // Самый сильный сигнал

        // Отображаем результат
        document.getElementById('bestPair').innerText = winner.pair.name;
        
        const signalText = document.getElementById('signalText');
        if (winner.isCall) {
          signalText.innerText = 'CALL ⬆ (ВВЕРХ)';
          signalText.className = 'signal-type signal-call';
        } else {
          signalText.innerText = 'PUT ⬇ (ВНИЗ)';
          signalText.className = 'signal-type signal-put';
        }

        let tfLabel = "1 Минута";
        if (tf === '10s') tfLabel = "10 Секунд";
        if (tf === '5m') tfLabel = "5 Минут";

        document.getElementById('timeBadge').innerText = `Экспирация: ${tfLabel}`;
        document.getElementById('accuracyText').innerText = `Сила совпадения (Confluence): ${Math.min(winner.score, 96)}%`;

        loader.style.display = 'none';
        resultBox.style.display = 'block';
        btn.disabled = false;
      }, 1200);
    }
  </script>
</body>
</html>
