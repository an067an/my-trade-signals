<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>AI Signal Bot</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
        body { background-color: #0d1117; color: #ffffff; padding: 15px; display: flex; flex-direction: column; min-height: 100vh; }
        .header { text-align: center; margin-bottom: 20px; font-weight: bold; font-size: 20px; color: #00ff66; text-shadow: 0 0 10px rgba(0,255,102,0.3); }
        .card { background: #161b22; border: 1px solid #30363d; border-radius: 12px; padding: 15px; margin-bottom: 15px; }
        label { display: block; font-size: 12px; color: #8b949e; margin-bottom: 8px; text-transform: uppercase; }
        select, button { width: 100%; background: #21262d; border: 1px solid #30363d; color: white; padding: 12px; border-radius: 8px; font-size: 14px; outline: none; }
        .tf-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
        .tf-btn { background: #21262d; border: 1px solid #30363d; color: #8b949e; padding: 10px; border-radius: 8px; font-size: 13px; font-weight: bold; cursor: pointer; text-align: center; }
        .tf-btn.active { border-color: #00ff66; color: #00ff66; background: rgba(0, 255, 102, 0.1); }
        .main-btn { background: #00ff66; color: #000; font-weight: bold; font-size: 16px; margin-top: 15px; border: none; cursor: pointer; box-shadow: 0 0 15px rgba(0, 255, 102, 0.4); }
        .main-btn:active { transform: scale(0.98); }
        .result-box { display: none; text-align: center; padding: 20px; margin-top: 10px; background: #161b22; border: 1px solid #00ff66; border-radius: 12px; }
        .signal-type { font-size: 24px; font-weight: bold; margin: 10px 0; }
        .call { color: #00ff66; }
        .put { color: #ff3366; }
        .loader { display: none; text-align: center; margin: 15px 0; color: #8b949e; font-size: 14px; }
    </style>
</head>
<body>

    <div class="header">⚡ PingWIN AI BOT</div>

    <div class="card">
        <label>Выберите актив</label>
        <select id="asset">
            <option value="EUR/USD OTC">EUR/USD OTC</option>
            <option value="GBP/USD OTC">GBP/USD OTC</option>
            <option value="USD/CNH OTC">USD/CNH OTC</option>
            <option value="AUD/CHF OTC">AUD/CHF OTC</option>
            <option value="USD/INR OTC">USD/INR OTC</option>
        </select>
    </div>

    <div class="card">
        <label>Время экспирации</label>
        <div class="tf-grid">
            <div class="tf-btn" onclick="selectTF(this, '5s')">5s</div>
            <div class="tf-btn" onclick="selectTF(this, '15s')">15s</div>
            <div class="tf-btn" onclick="selectTF(this, '30s')">30s</div>
            <div class="tf-btn active" onclick="selectTF(this, '1m')">1m</div>
            <div class="tf-btn" onclick="selectTF(this, '3m')">3m</div>
            <div class="tf-btn" onclick="selectTF(this, '5m')">5m</div>
        </div>
    </div>

    <button class="main-btn" onclick="getSignal()">ПОЛУЧИТЬ СИГНАЛ</button>

    <div class="loader" id="loader">🧠 AI анализирует свечи и индикаторы...</div>

    <div class="result-box" id="result">
        <div style="font-size: 12px; color: #8b949e;">Сигнал сформирован</div>
        <div class="signal-type" id="signalText">---</div>
        <div style="font-size: 13px; color: #8b949e;" id="signalDetails">--</div>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();

        let selectedTF = '1m';

        function selectTF(element, tf) {
            document.querySelectorAll('.tf-btn').forEach(btn => btn.classList.remove('active'));
            element.classList.add('active');
            selectedTF = tf;
        }

        function getSignal() {
            document.getElementById('result').style.display = 'none';
            document.getElementById('loader').style.display = 'block';

            setTimeout(() => {
                document.getElementById('loader').style.display = 'none';
                
                // Простейшая генерация сигнала (позже подключим реальный сервер)
                let isCall = Math.random() > 0.45;
                let asset = document.getElementById('asset').value;
                
                let signalText = document.getElementById('signalText');
                if(isCall) {
                    signalText.innerText = '↑ КУПИТЬ (CALL)';
                    signalText.className = 'signal-type call';
                } else {
                    signalText.innerText = '↓ ПРОДАТЬ (PUT)';
                    signalText.className = 'signal-type put';
                }

                document.getElementById('signalDetails').innerText = `${asset} | Время: ${selectedTF}`;
                document.getElementById('result').style.display = 'block';
            }, 1500);
        }
    </script>
</body>
</html>
