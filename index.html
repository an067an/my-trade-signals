<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>⚡ Бот</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --accent: #38bdf8;
      --green: #22c55e;
      --red: #ef4444;
      --text: #f8fafc;
      --subtext: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    body { background-color: var(--bg-color); color: var(--text); display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 16px; }
    .header { width: 100%; text-align: center; margin-bottom: 20px; font-weight: 700; font-size: 20px; color: var(--accent); }
    .card { background: var(--card-bg); width: 100%; max-width: 400px; border-radius: 16px; padding: 16px; margin-bottom: 16px; border: 1px solid #334155; }
    label { font-size: 12px; color: var(--subtext); text-transform: uppercase; letter-spacing: 0.5px; display: block; margin-bottom: 8px; }
    select, button { width: 100%; padding: 12px; border-radius: 10px; border: none; background: #0f172a; color: var(--text); font-size: 15px; outline: none; border: 1px solid #334155; }
    select { margin-bottom: 12px; }
    .btn-main { background: linear-gradient(135deg, #0284c7, #38bdf8); color: #fff; font-weight: 600; cursor: pointer; transition: transform 0.1s, opacity 0.2s; border: none; margin-top: 8px; }
    .btn-main:active { transform: scale(0.98); }
    .btn-main:disabled { opacity: 0.5; cursor: not-allowed; }
    .price-box { display: flex; justify-content: space-between; align-items: center; margin-top: 8px; font-size: 14px; }
    .price-value { font-weight: bold; font-family: monospace; }
    .result-box { display: none; text-align: center; padding: 20px 10px; }
    .signal-type { font-size: 28px; font-weight: 900; margin: 10px 0; }
    .signal-call { color: var(--green); }
    .signal-put { color: var(--red); }
    .accuracy { font-size: 14px; color: var(--subtext); }
    .loader { display: none; text-align: center; margin: 15px 0; }
    .spinner { border: 3px solid rgba(255,255,255,0.1); border-top: 3px solid var(--accent); border-radius: 50%; width: 30px; height: 30px; animation: spin 0.8s linear infinite; margin: 0 auto 10px; }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    .rsi-info { font-size: 12px; color: var(--subtext); margin-top: 6px; }
  </style>
</head>
<body>

  <div class="header">⚡ Бот — RSI Live Analytics</div>

  <div class="card">
    <label>Валютная пара</label>
    <select id="pairSelect" onchange="changePair()">
      <option value="btcusdt">BTC / USDT</option>
      <option value="ethusdt">ETH / USDT</option>
      <option value="solusdt">SOL / USDT</option>
      <option value="xrpusdt">XRP / USDT</option>
      <option value="adausdt">ADA / USDT</option>
    </select>

    <label>Таймфрейм</label>
    <select id="tfSelect">
      <option value="1m">1 минута</option>
      <option value="3m">3 минуты</option>
      <option value="5m">5 минут</option>
    </select>

    <div class="price-box">
      <span>Текущая цена Binance:</span>
      <span id="livePrice" class="price-value">Подключение...</span>
    </div>
    <div class="rsi-info">Текущий RSI (14): <span id="liveRsi" style="font-weight:bold; color:var(--accent);">--</span></div>

    <button id="getSignalBtn" class="btn-main" onclick="generateSignal()">Анализировать рынок</button>
  </div>

  <div class="card">
    <div id="loader" class="loader">
      <div class="spinner"></div>
      <div style="font-size: 13px; color: var(--subtext);">Считывание тиков и расчёт RSI...</div>
    </div>

    <div id="resultBox" class="result-box">
      <div style="font-size: 12px; color: var(--subtext);">Анализ завершён</div>
      <div id="signalText" class="signal-type">---</div>
      <div id="accuracyText" class="accuracy">Точность расчёта: --%</div>
    </div>
  </div>

  <script>
    if (window.Telegram && window.Telegram.WebApp) {
      window.Telegram.WebApp.ready();
      window.Telegram.WebApp.expand();
    }

    let ws = null;
    let pricesHistory = [];
    const maxPrices = 50; // Для расчёта RSI

    function changePair() {
      const pair = document.getElementById('pairSelect').value;
      document.getElementById('livePrice').innerText = 'Подключение...';
      document.getElementById('liveRsi').innerText = '--';
      pricesHistory = [];

      if (ws) { ws.close(); }

      // WebSocket к бирже Binance
      ws = new WebSocket(`wss://stream.binance.com:9443/ws/${pair}@trade`);

      ws.onmessage = (event) => {
        const data = JSON.parse(event.data);
        const price = parseFloat(data.p);
        document.getElementById('livePrice').innerText = price.toFixed(2) + ' $';

        pricesHistory.push(price);
        if (pricesHistory.length > maxPrices) {
          pricesHistory.shift();
        }

        if (pricesHistory.length >= 15) {
          const rsi = calculateRSI(pricesHistory, 14);
          document.getElementById('liveRsi').innerText = rsi.toFixed(1);
        }
      };
    }

    function calculateRSI(prices, period = 14) {
      let gains = 0;
      let losses = 0;

      for (let i = prices.length - period; i < prices.length; i++) {
        const difference = prices[i] - prices[i - 1];
        if (difference >= 0) {
          gains += difference;
        } else {
          losses -= difference;
        }
      }

      const avgGain = gains / period;
      const avgLoss = losses / period;

      if (avgLoss === 0) return 100;
      const rs = avgGain / avgLoss;
      return 100 - (100 / (1 + rs));
    }

    function generateSignal() {
      if (pricesHistory.length < 15) {
        alert('Подождите пару секунд, пока бот накопит живые тики цены для расчёта!');
        return;
      }

      const btn = document.getElementById('getSignalBtn');
      const loader = document.getElementById('loader');
      const resultBox = document.getElementById('resultBox');

      btn.disabled = true;
      resultBox.style.display = 'none';
      loader.style.display = 'block';

      setTimeout(() => {
        loader.style.display = 'none';
        resultBox.style.display = 'block';
        btn.disabled = false;

        const currentRsi = calculateRSI(pricesHistory, 14);
        const signalText = document.getElementById('signalText');
        const accuracyText = document.getElementById('accuracyText');

        let direction = 'CALL ⬆';
        let isCall = true;
        let accuracy = 82;

        if (currentRsi > 70) {
          // Сильная перекупленность -> сигнал PUT
          direction = 'PUT ⬇';
          isCall = false;
          accuracy = Math.min(96, Math.floor(88 + (currentRsi - 70) * 0.4));
        } else if (currentRsi < 30) {
          // Сильная перепроданность -> сигнал CALL
          direction = 'CALL ⬆';
          isCall = true;
          accuracy = Math.min(96, Math.floor(88 + (30 - currentRsi) * 0.4));
        } else {
          // В нейтральной зоне смотрим микротренд
          const lastPrice = pricesHistory[pricesHistory.length - 1];
          const prevPrice = pricesHistory[pricesHistory.length - 5] || pricesHistory[0];
          if (lastPrice >= prevPrice) {
            direction = 'CALL ⬆';
            isCall = true;
          } else {
            direction = 'PUT ⬇';
            isCall = false;
          }
          accuracy = Math.floor(78 + Math.random() * 8);
        }

        signalText.innerText = direction;
        signalText.className = 'signal-type ' + (isCall ? 'signal-call' : 'signal-put');
        accuracyText.innerText = `Точность алгоритма (RSI ${currentRsi.toFixed(1)}): ${accuracy}%`;
      }, 1200);
    }

    // Инициализация при загрузке
    changePair();
  </script>
</body>
</html>
