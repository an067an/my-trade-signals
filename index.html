<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>⚡ Pocket Option Signal Bot Pro</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --accent: #38bdf8;
      --green: #22c55e;
      --red: #ef4444;
      --yellow: #eab308;
      --text: #f8fafc;
      --subtext: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    body { background-color: var(--bg-color); color: var(--text); display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 16px; }
    .header { width: 100%; text-align: center; margin-bottom: 12px; font-weight: 700; font-size: 18px; color: var(--accent); }
    
    .tab-box { display: flex; width: 100%; max-width: 400px; background: #0f172a; padding: 4px; border-radius: 12px; margin-bottom: 12px; border: 1px solid #334155; }
    .tab-btn { flex: 1; padding: 8px; text-align: center; font-size: 12px; font-weight: 600; color: var(--subtext); border-radius: 8px; cursor: pointer; border: none; background: transparent; transition: 0.2s; }
    .tab-btn.active { background: var(--card-bg); color: var(--accent); border: 1px solid #334155; }
    
    .card { background: var(--card-bg); width: 100%; max-width: 400px; border-radius: 16px; padding: 16px; margin-bottom: 12px; border: 1px solid #334155; }
    label { font-size: 11px; color: var(--subtext); text-transform: uppercase; letter-spacing: 0.5px; display: block; margin-bottom: 6px; }
    select, input, button { width: 100%; padding: 12px; border-radius: 10px; border: none; background: #0f172a; color: var(--text); font-size: 14px; outline: none; border: 1px solid #334155; }
    select, input { margin-bottom: 10px; }
    
    .btn-main { background: linear-gradient(135deg, #0284c7, #38bdf8); color: #fff; font-weight: 700; font-size: 14px; cursor: pointer; border: none; margin-top: 4px; box-shadow: 0 4px 14px rgba(56, 189, 248, 0.25); }
    .btn-scan { background: linear-gradient(135deg, #10b981, #22c55e); color: #fff; font-weight: 700; font-size: 14px; cursor: pointer; border: none; margin-top: 4px; box-shadow: 0 4px 14px rgba(34, 197, 94, 0.25); }
    
    .result-box { display: none; text-align: center; padding: 16px 8px; }
    .pair-badge { font-size: 18px; font-weight: 800; color: var(--accent); margin-bottom: 6px; display: inline-block; background: #0f172a; padding: 6px 14px; border-radius: 8px; border: 1px solid #334155; }
    .payout-tag { font-size: 11px; color: var(--green); font-weight: bold; background: rgba(34, 197, 94, 0.1); padding: 2px 6px; border-radius: 4px; }
    .signal-type { font-size: 28px; font-weight: 900; margin: 10px 0; }
    .signal-call { color: var(--green); }
    .signal-put { color: var(--red); }
    .accuracy { font-size: 13px; color: var(--subtext); margin-top: 4px; }
    .time-badge { font-size: 12px; color: var(--yellow); font-weight: bold; margin-top: 6px; }
    .warning-note { font-size: 11px; color: var(--subtext); margin-top: 12px; border-top: 1px solid #334155; padding-top: 8px; }
    
    .loader { display: none; text-align: center; margin: 20px 0; }
    .spinner { border: 3px solid rgba(255,255,255,0.1); border-top: 3px solid var(--accent); border-radius: 50%; width: 32px; height: 32px; animation: spin 0.8s linear infinite; margin: 0 auto 10px; }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
  </style>
</head>
<body>

  <div class="header">⚡ Pocket Option Signal Bot Pro</div>

  <div class="tab-box">
    <button id="tabSingle" class="tab-btn active" onclick="switchMode('single')">Моя пара (10s/1m)</button>
    <button id="tabScan" class="tab-btn" onclick="switchMode('scan')">Сканер рынка (3m/5m)</button>
  </div>

  <div class="card">
    <div id="singlePairBlock">
      <label>Выбор активной котировки</label>
      <select id="pairSelect">
        <!-- Валютные OTC пары -->
        <optgroup label="💱 Валютные OTC пары (92%)">
          <option value="EURUSD_OTC" selected>EUR / USD (OTC) [92%]</option>
          <option value="GBPUSD_OTC">GBP / USD (OTC) [92%]</option>
          <option value="USDJPY_OTC">USD / JPY (OTC) [92%]</option>
          <option value="AUDUSD_OTC">AUD / USD (OTC) [92%]</option>
          <option value="USDCAD_OTC">USD / CAD (OTC) [92%]</option>
          <option value="USDCHF_OTC">USD / CHF (OTC) [92%]</option>
          <option value="EURGBP_OTC">EUR / GBP (OTC) [92%]</option>
          <option value="EURJPY_OTC">EUR / JPY (OTC) [92%]</option>
          <option value="AUDCAD_OTC">AUD / CAD (OTC) [92%]</option>
          <option value="NZDUSD_OTC">NZD / USD (OTC) [92%]</option>
        </optgroup>
        
        <!-- Криптовалюта OTC -->
        <optgroup label="₿ Криптовалюта OTC (92%)">
          <option value="BTCUSD_OTC">Bitcoin OTC [92%]</option>
          <option value="ETHUSD_OTC">Ethereum OTC [92%]</option>
          <option value="LTCUSD_OTC">Litecoin OTC [92%]</option>
        </optgroup>

        <!-- Сырьё и Металлы OTC -->
        <optgroup label="🥇 Металлы и Сырьё OTC">
          <option value="GOLD_OTC">Gold OTC (Золото) [92%]</option>
          <option value="SILVER_OTC">Silver OTC (Серебро) [92%]</option>
          <option value="BRENT_OTC">UKBRENT OTC (Нефть) [92%]</option>
        </optgroup>

        <!-- Акции OTC -->
        <optgroup label="📊 Акции OTC (92%)">
          <option value="AAPL_OTC">Apple OTC [92%]</option>
          <option value="TSLA_OTC">Tesla OTC [92%]</option>
          <option value="AMZN_OTC">Amazon OTC [92%]</option>
          <option value="MSFT_OTC">Microsoft OTC [92%]</option>
        </optgroup>
      </select>
    </div>

    <label>Экспирация</label>
    <select id="tfSelect">
      <option value="10s">10 секунд</option>
      <option value="1m" selected>1 минута</option>
      <option value="3m">3 минуты</option>
      <option value="5m">5 минут</option>
    </select>

    <button id="actionBtn" class="btn-main" onclick="executeAnalysis()">⚡ ПОЛУЧИТЬ СИГНАЛ</button>
  </div>

  <div class="card">
    <div id="loader" class="loader">
      <div class="spinner"></div>
      <div id="scanStatus" style="font-size: 12px; color: var(--subtext);">Анализ индикаторов...</div>
    </div>

    <div id="resultBox" class="result-box">
      <div style="font-size: 11px; color: var(--subtext); margin-bottom: 6px;">РЕКОМЕНДАЦИЯ АЛГОРИТМА</div>
      <div id="bestPair" class="pair-badge">EUR / USD (OTC) <span class="payout-tag">92%</span></div>
      
      <div id="signalText" class="signal-type">CALL ⬆</div>
      
      <div id="timeBadge" class="time-badge">Время входа: 1 Минута</div>
      <div id="accuracyText" class="accuracy">Уверенность (Confluence Score): 92%</div>
      
      <div class="warning-note">⚠️ Проверяйте MACD и выплатный процент (>80%) перед кликом!</div>
    </div>
  </div>

  <script>
    if (window.Telegram && window.Telegram.WebApp) {
      window.Telegram.WebApp.ready();
      window.Telegram.WebApp.expand();
    }

    let currentMode = 'single';

    const pairsPool = [
      { id: 'EURUSD_OTC', name: 'EUR / USD (OTC)', base: 1.0850 },
      { id: 'GBPUSD_OTC', name: 'GBP / USD (OTC)', base: 1.2650 },
      { id: 'USDJPY_OTC', name: 'USD / JPY (OTC)', base: 155.20 },
      { id: 'AUDUSD_OTC', name: 'AUD / USD (OTC)', base: 0.6650 },
      { id: 'USDCAD_OTC', name: 'USD / CAD (OTC)', base: 1.3680 },
      { id: 'USDCHF_OTC', name: 'USD / CHF (OTC)', base: 0.8950 },
      { id: 'EURGBP_OTC', name: 'EUR / GBP (OTC)', base: 0.8580 },
      { id: 'EURJPY_OTC', name: 'EUR / JPY (OTC)', base: 168.40 },
      { id: 'AUDCAD_OTC', name: 'AUD / CAD (OTC)', base: 0.9120 },
      { id: 'NZDUSD_OTC', name: 'NZD / USD (OTC)', base: 0.6150 },
      { id: 'BTCUSD_OTC', name: 'Bitcoin OTC', base: 64200.0 },
      { id: 'ETHUSD_OTC', name: 'Ethereum OTC', base: 3450.0 },
      { id: 'LTCUSD_OTC', name: 'Litecoin OTC', base: 74.5 },
      { id: 'GOLD_OTC',   name: 'Gold OTC', base: 2380.50 },
      { id: 'SILVER_OTC', name: 'Silver OTC', base: 28.40 },
      { id: 'BRENT_OTC',  name: 'UKBRENT OTC', base: 82.30 },
      { id: 'AAPL_OTC',   name: 'Apple OTC', base: 224.30 },
      { id: 'TSLA_OTC',   name: 'Tesla OTC', base: 251.50 },
      { id: 'AMZN_OTC',   name: 'Amazon OTC', base: 185.40 },
      { id: 'MSFT_OTC',   name: 'Microsoft OTC', base: 445.20 }
    ];

    function switchMode(mode) {
      currentMode = mode;
      const tabSingle = document.getElementById('tabSingle');
      const tabScan = document.getElementById('tabScan');
      const singleBlock = document.getElementById('singlePairBlock');
      const actionBtn = document.getElementById('actionBtn');

      if (mode === 'single') {
        tabSingle.className = 'tab-btn active';
        tabScan.className = 'tab-btn';
        singleBlock.style.display = 'block';
        actionBtn.className = 'btn-main';
        actionBtn.innerText = '⚡ ПОЛУЧИТЬ СИГНАЛ ПО МОЕЙ ПАРЕ';
      } else {
        tabSingle.className = 'tab-btn';
        tabScan.className = 'tab-btn active';
        singleBlock.style.display = 'none';
        actionBtn.className = 'btn-scan';
        actionBtn.innerText = '🚀 НАЙТИ ЛУЧШИЙ ВХОД НА РЫНКЕ';
      }
    }

    function generateSimulatedHistory(basePrice) {
      let history = [];
      let price = basePrice;
      for (let i = 0; i < 30; i++) {
        price += (Math.random() - 0.495) * (price * 0.00012);
        history.push(price);
      }
      return history;
    }

    function calculateRSI(prices, period = 14) {
      let gains = 0, losses = 0;
      for (let i = prices.length - period; i < prices.length; i++) {
        const diff = prices[i] - prices[i - 1];
        if (diff >= 0) gains += diff; else losses -= diff;
      }
      if (losses === 0) return 100;
      return 100 - (100 / (1 + (gains / losses)));
    }

    function calculateEMA(prices, period = 10) {
      const k = 2 / (period + 1);
      let ema = prices[prices.length - period];
      for (let i = prices.length - period + 1; i < prices.length; i++) {
        ema = (prices[i] * k) + (ema * (1 - k));
      }
      return ema;
    }

    function executeAnalysis() {
      const btn = document.getElementById('actionBtn');
      const loader = document.getElementById('loader');
      const resultBox = document.getElementById('resultBox');
      const scanStatus = document.getElementById('scanStatus');
      const tf = document.getElementById('tfSelect').value;

      btn.disabled = true;
      resultBox.style.display = 'none';
      loader.style.display = 'block';

      if (currentMode === 'single') {
        scanStatus.innerText = "Расчёт индикаторов выбранной пары...";
        setTimeout(() => {
          const pairId = document.getElementById('pairSelect').value;
          const selectedPairObj = pairsPool.find(p => p.id === pairId) || pairsPool[0];
          
          const history = generateSimulatedHistory(selectedPairObj.base);
          const rsi = calculateRSI(history, 14);
          const ema = calculateEMA(history, 10);
          const lastPrice = history[history.length - 1];

          let isCall = rsi < 50;
          let score = 82 + Math.floor(Math.random() * 10);

          if (rsi <= 35) { isCall = true; score += 6; }
          else if (rsi >= 65) { isCall = false; score += 6; }
          else if (lastPrice >= ema) { isCall = true; }
          else { isCall = false; }

          renderResult(selectedPairObj.name, isCall, score, tf);
        }, 500);
      } else {
        scanStatus.innerText = "Сканирование всех 20+ OTC-активов...";
        setTimeout(() => {
          let ratedPairs = pairsPool.map(pair => {
            const history = generateSimulatedHistory(pair.base);
            const rsi = calculateRSI(history, 14);
            const ema = calculateEMA(history, 10);
            const lastPrice = history[history.length - 1];

            let isCall = rsi < 50;
            let score = 78 + Math.floor(Math.random() * 8);

            if (rsi <= 30) { isCall = true; score += 14; }
            else if (rsi >= 70) { isCall = false; score += 14; }
            else if (rsi < 45 && lastPrice > ema) { isCall = true; score += 6; }
            else if (rsi > 55 && lastPrice < ema) { isCall = false; score += 6; }

            return { pair, isCall, score };
          });

          ratedPairs.sort((a, b) => b.score - a.score);
          const winner = ratedPairs[0];
          renderResult(winner.pair.name, winner.isCall, winner.score, tf);
        }, 900);
      }
    }

    function renderResult(pairName, isCall, score, tf) {
      const loader = document.getElementById('loader');
      const resultBox = document.getElementById('resultBox');
      const btn = document.getElementById('actionBtn');

      document.getElementById('bestPair').innerHTML = `${pairName} <span class="payout-tag">92%</span>`;
      
      const signalText = document.getElementById('signalText');
      if (isCall) {
        signalText.innerText = 'CALL ⬆ (ВВЕРХ)';
        signalText.className = 'signal-type signal-call';
      } else {
        signalText.innerText = 'PUT ⬇ (ВНИЗ)';
        signalText.className = 'signal-type signal-put';
      }

      let tfMap = { '10s': '10 Секунд', '1m': '1 Минута', '3m': '3 Минуты', '5m': '5 Минут' };
      document.getElementById('timeBadge').innerText = `Экспирация: ${tfMap[tf] || tf}`;
      document.getElementById('accuracyText').innerText = `Уверенность (Confluence): ${Math.min(score, 96)}%`;

      loader.style.display = 'none';
      resultBox.style.display = 'block';
      btn.disabled = false;
    }
  </script>
</body>
</html>
