<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Бот</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            background-color: #121721;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .header {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 25px;
            color: #00e5ff;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            text-shadow: 0 0 10px rgba(0, 229, 255, 0.4);
        }

        .card {
            background: #1e2638;
            border: 1px solid #2a354d;
            border-radius: 16px;
            padding: 20px;
            width: 100%;
            max-width: 380px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.3);
            margin-bottom: 20px;
            box-sizing: border-box;
        }

        label {
            display: block;
            font-size: 14px;
            color: #8f9bba;
            margin-bottom: 8px;
            text-transform: uppercase;
            font-weight: 600;
        }

        select {
            width: 100%;
            padding: 14px;
            background: #161c2b;
            border: 1px solid #2a354d;
            border-radius: 10px;
            color: #ffffff;
            font-size: 16px;
            margin-bottom: 20px;
            outline: none;
            appearance: none;
            cursor: pointer;
        }

        select:focus {
            border-color: #00e5ff;
        }

        .btn {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #00e5ff 0%, #0088ff 100%);
            border: none;
            border-radius: 12px;
            color: #ffffff;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0, 229, 255, 0.3);
            transition: transform 0.1s ease, box-shadow 0.1s ease;
        }

        .btn:active {
            transform: scale(0.98);
            box-shadow: 0 2px 8px rgba(0, 229, 255, 0.2);
        }

        .result-box {
            display: none;
            text-align: center;
            margin-top: 15px;
            padding: 20px;
            border-radius: 12px;
            background: #161c2b;
            border: 1px solid #2a354d;
        }

        .signal-direction {
            font-size: 32px;
            font-weight: 900;
            margin: 10px 0;
            text-transform: uppercase;
        }

        .buy { color: #00e676; text-shadow: 0 0 12px rgba(0, 230, 118, 0.4); }
        .sell { color: #ff1744; text-shadow: 0 0 12px rgba(255, 23, 68, 0.4); }

        .accuracy {
            font-size: 14px;
            color: #8f9bba;
        }

        .loader {
            display: none;
            margin: 15px auto;
            border: 4px solid #161c2b;
            border-top: 4px solid #00e5ff;
            border-radius: 50%;
            width: 36px;
            height: 36px;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <div class="header">⚡ Бот</div>

    <div class="card">
        <label for="asset">Выберите актив:</label>
        <select id="asset">
            <option value="EUR/USD">EUR / USD (OTC)</option>
            <option value="GBP/USD">GBP / USD (OTC)</option>
            <option value="USD/JPY">USD / JPY (OTC)</option>
            <option value="BTC/USD">BTC / USD</option>
            <option value="ETH/USD">ETH / USD</option>
        </select>

        <label for="timeframe">Таймфрейм:</label>
        <select id="timeframe">
            <option value="10s">10 секунд</option>
            <option value="1m">1 минута</option>
            <option value="5m">5 минут</option>
        </select>

        <button class="btn" onclick="getSignal()">ПОЛУЧИТЬ СИГНАЛ</button>
    </div>

    <div class="card">
        <div class="loader" id="loader"></div>
        <div class="result-box" id="resultBox">
            <div class="accuracy" id="signalPair">EUR/USD (1m)</div>
            <div class="signal-direction" id="signalText">CALL ⬆</div>
            <div class="accuracy">Точность ИИ: <span id="accuracyVal" style="color: #00e5ff;">92%</span></div>
        </div>
    </div>

    <script>
        const tg = window.Telegram ? window.Telegram.WebApp : null;
        if (tg) {
            tg.expand();
        }

        function getSignal() {
            const asset = document.getElementById('asset').value;
            const timeframe = document.getElementById('timeframe').value;
            const loader = document.getElementById('loader');
            const resultBox = document.getElementById('resultBox');
            const signalText = document.getElementById('signalText');
            const signalPair = document.getElementById('signalPair');
            const accuracyVal = document.getElementById('accuracyVal');

            resultBox.style.display = 'none';
            loader.style.display = 'block';

            setTimeout(() => {
                loader.style.display = 'none';
                
                const isCall = Math.random() > 0.5;
                const accuracy = (Math.random() * (96 - 84) + 84).toFixed(1);

                signalPair.innerText = `${asset} (${timeframe})`;
                accuracyVal.innerText = `${accuracy}%`;

                if (isCall) {
                    signalText.innerText = 'CALL ⬆';
                    signalText.className = 'signal-direction buy';
                } else {
                    signalText.innerText = 'PUT ⬇';
                    signalText.className = 'signal-direction sell';
                }

                resultBox.style.display = 'block';
            }, 1200);
        }
    </script>
</body>
</html>
