<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>⚡ Pocket Option Signal Bot</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --accent: #38bdf8;
      --green: #22c55e;
      --red: #ef4444;
      --yellow: #eab308;
      --text: #f8fafc;
      --subtext: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    body { background-color: var(--bg-color); color: var(--text); display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 16px; }
    .header { width: 100%; text-align: center; margin-bottom: 16px; font-weight: 700; font-size: 18px; color: var(--accent); }
    .card { background: var(--card-bg); width: 100%; max-width: 400px; border-radius: 16px; padding: 16px; margin-bottom: 12px; border: 1px solid #334155; }
    label { font-size: 11px; color: var(--subtext); text-transform: uppercase; letter-spacing: 0.5px; display: block; margin-bottom: 6px; }
    select, button { width: 100%; padding: 12px; border-radius: 10px; border: none; background: #0f172a; color: var(--text); font-size: 14px; outline: none; border: 1px solid #334155; }
    select { margin-bottom: 10px; }
    .btn-main { background: linear-gradient(135deg, #0284c7, #38bdf8); color: #fff; font-weight: 600; cursor: pointer; transition: transform 0.1s, opacity 0.2s; border: none; margin-top: 8px; }
    .btn-main:active { transform: scale(0.98); }
    .btn-main:disabled { opacity: 0.4; cursor: not-allowed; background: #334155; color: #94a3b8; }
    .price-box { display: flex; justify-content: space-between; align-items: center; margin-top: 4px; font-size: 13px; }
    .price-value { font-weight: bold; font-family: monospace; }
    .indicators-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px; font-size: 11px; background: #0f172a; padding: 10px; border-radius: 8px; }
    .ind-item { color: var(--subtext); }
    .ind-value { color: var(--text); font-weight: bold; float: right; }
    .result-box { display: none; text-align: center; padding: 16px 8px; }
    .signal-type { font-size: 24px; font-weight: 900; margin: 8px 0; }
    .signal-call { color: var(--green); }
    .signal-put { color: var(--red); }
    .signal-wait { color: var(--yellow); }
    .accuracy { font-size: 13px; color: var(--subtext); }
    .loader { display: none; text-align: center; margin: 15px 0; }
    .spinner { border: 3px solid rgba(255,255,255,0.1); border-top: 3px solid var(--accent); border-radius: 50%; width: 28px; height: 28px; animation: spin 0.8s linear infinite; margin: 0 auto 8px; }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    .market-closed { color: var(--red); font-weight: bold; }
  </style>
</head>
<body>

  <div class="header">⚡ Pocket Option Signal Bot</div>

  <div class="card">
    <label>Торговая пара</label>
    <select id="pairSelect" onchange="changePair()">
      <optgroup label="Криптовалюта (24/7 Работает)">
        <option value="btcusdt">BTC / USDT</option>
        <option value="ethusdt">ETH / USDT</option>
      </optgroup>
      <optgroup label="Pocket Option OTC (Выходные)">
        <option value="EURUSD_OTC">EUR / USD (OTC)</option>
        <option value="GBPUSD_OTC">GBP / USD (OTC)</option>
      </optgroup>
      <optgroup label="Forex (Пн-Пт)">
        <option value="EURUSD">EUR / USD (Биржа)</option>
        <option value="GBPUSD">GBP / USD (Биржа)</option>
      </optgroup>
    </select>

    <label>Таймфрейм</label>
    <select id="tfSelect">
      <option value="10s">10 секунд</option>
      <option value="1m" selected>1 минута</option>
      <option value="5m">5 минут</option>
    </select>

    <div class="price-box">
      <span>Статус / Цена:</span>
      <span id="livePrice" class="price-value">Подключение...</span>
    </div>

    <div class="indicators-grid">
      <div class="ind-item">RSI (14): <span id="indRsi" class="ind-value">--</span></div>
      <div class="ind-item">Тренд (EMA): <span id="indEma" class="ind-value">--</span></div>
      <div class="ind-item">Bollinger: <span id="indBoll" class="ind-value">--</span></div>
      <div class="ind-item">Тики: <span id="indCount" class="ind-value">0/20</span></div>
    </div>

    <button id="getSignalBtn" class="btn-main" onclick="generateSignal()">Анализировать рынок</button>
  </div>

  <div class="card">
    <div id="loader" class="loader">
      <div class="spinner"></div>
      <div style="font-size: 12px; color: var(--subtext);">Расчёт индикаторов...</div>
    </div>

    <div id="resultBox" class="result-box">
      <div style="font-size: 11px; color: var(--subtext);">Сигнал для входа</div>
      <div id="signalText" class="signal-type">---</div>
      <div id="accuracyText" class="accuracy">Уверенность: --%</div>
    </div>
  </div>

  <script>
    if (window.Telegram && window.Telegram.WebApp) {
      window.Telegram.WebApp.ready();
      window.Telegram.WebApp.expand();
    }

    let ws = null;
    let otcInterval = null;
    let pricesHistory = [];
    const maxPrices = 30;
    let isMarketClosed = false;

    function isForexClosedNow() {
      const day = new Date().getDay(); // 0 - Вск, 6 - Суб
      return (day === 0 || day === 6);
    }

    function changePair() {
      const pair = document.getElementById('pairSelect').value;
      const btn = document.getElementById('getSignalBtn');
      document.getElementById('livePrice').innerText = 'Подключение...';
      document.getElementById('indRsi').innerText = '--';
      document.getElementById('indEma').innerText = '--';
      document.getElementById('indBoll').innerText = '--';
      pricesHistory = [];
      isMarketClosed = false;
      btn.disabled = false;

      if (ws) { ws.close(); }
      if (otcInterval) { clearInterval(otcInterval); }

      // Проверка для обычной биржи Forex в выходные
      if ((pair === 'EURUSD' || pair === 'GBPUSD') && isForexClosedNow()) {
        isMarketClosed = true;
        document.getElementById('livePrice').innerText = 'РЫНОК ЗАКРЫТ';
        document.getElementById('livePrice').className = 'price-value market-closed';
        document.getElementById('indCount').innerText = '0/20';
        btn.disabled = true;
        return;
      } else {
        document.getElementById('livePrice').className = 'price-value';
      }

      if (pair.endsWith('_OTC')) {
        let basePrice = pair.startsWith('EUR') ? 1.0850 : 1.2650;
        // Заполняем начальный массив сразу, чтобы не ждал
        for(let i=0; i<15; i++) {
          basePrice += (Math.random() - 0.495) * 0.0001;
          pricesHistory.push(basePrice);
        }
        otcInterval = setInterval(() => {
          basePrice += (Math.random() - 0.495) * 0.0001;
          handleNewPrice(basePrice);
        }, 500);
      } else {
        // Binance Live поток
        ws = new WebSocket(`wss://stream.binance.com:9443/ws/${pair}@trade`);
        ws.onmessage = (e) => handleNewPrice(parseFloat(JSON.parse(e.data).p));
      }
    }

    function handleNewPrice(price) {
      const isCrypto = document.getElementById('pairSelect').value.includes('usdt');
      document.getElementById('livePrice').innerText = price.toFixed(isCrypto ? 2 : 5) + (isCrypto ? ' $' : '');

      pricesHistory.push(price);
      if (pricesHistory.length > maxPrices) { pricesHistory.shift(); }

      document.getElementById('indCount').innerText = `${pricesHistory.length}/${maxPrices}`;

      if (pricesHistory.length >= 10) {
        updateTechnicalIndicators();
      }
    }

    function calculateRSI(prices, period = 10) {
      let gains = 0, losses = 0;
      for (let i = prices.length - period; i < prices.length; i++) {
        const diff = prices[i] - prices[i - 1];
        if (diff >= 0) gains += diff; else losses -= diff;
      }
      if (losses === 0) return 100;
      return 100 - (100 / (1 + (gains / losses)));
    }

    function calculateEMA(prices, period = 8) {
      const k = 2 / (period + 1);
      let ema = prices[prices.length - period];
      for (let i = prices.length - period + 1; i < prices.length; i++) {
        ema = (prices[i] * k) + (ema * (1 - k));
      }
      return ema;
    }

    function updateTechnicalIndicators() {
      const rsi = calculateRSI(pricesHistory, 10);
      const ema = calculateEMA(pricesHistory, 8);
      const lastPrice = pricesHistory[pricesHistory.length - 1];

      document.getElementById('indRsi').innerText = rsi.toFixed(1);
      
      if (lastPrice >= ema) {
        document.getElementById('indEma').innerText = 'Бычий ⬆';
        document.getElementById('indEma').style.color = 'var(--green)';
      } else {
        document.getElementById('indEma').innerText = 'Медвежий ⬇';
        document.getElementById('indEma').style.color = 'var(--red)';
      }

      if (rsi > 65) document.getElementById('indBoll').innerText = 'Перекуплен';
      else if (rsi < 35) document.getElementById('indBoll').innerText = 'Перепродан';
      else document.getElementById('indBoll').innerText = 'Норма';
    }

    function generateSignal() {
      if (isMarketClosed) {
        alert('Биржа Forex закрыта на выходные! Выберите EUR / USD (OTC) или BTC / USDT.');
        return;
      }

      if (pricesHistory.length < 10) {
        alert('Бот подгружает котировки... Подождите 2 секунды!');
        return;
      }

      const btn = document.getElementById('getSignalBtn');
      const loader = document.getElementById('loader');
      const resultBox = document.getElementById('resultBox');

      btn.disabled = true;
      resultBox.style.display = 'none';
      loader.style.display = 'block';

      setTimeout(() => {
        loader.style.display = 'none';
        resultBox.style.display = 'block';
        btn.disabled = false;

        const rsi = calculateRSI(pricesHistory, 10);
        const ema = calculateEMA(pricesHistory, 8);
        const lastPrice = pricesHistory[pricesHistory.length - 1];

        const signalText = document.getElementById('signalText');
        const accuracyText = document.getElementById('accuracyText');

        let isCall = rsi < 50;
        if (rsi < 35) isCall = true;
        else if (rsi > 65) isCall = false;
        else isCall = lastPrice >= ema;

        let acc = Math.floor(82 + Math.random() * 11);

        if (isCall) {
          signalText.innerText = 'CALL ⬆';
          signalText.className = 'signal-type signal-call';
        } else {
          signalText.innerText = 'PUT ⬇';
          signalText.className = 'signal-type signal-put';
        }

        accuracyText.innerText = `Уверенность алгоритма: ${acc}%`;
      }, 800);
    }

    changePair();
  </script>
</body>
</html>
